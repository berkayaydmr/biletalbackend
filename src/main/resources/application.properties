spring.application.name=biletalbackend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/biletaldb
spring.datasource.username=${DATABASE_USER:db_user}
spring.datasource.password=${DATABASE_PASS:db_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=biletal_jwt_secret_key_should_be_at_least_256_bits_long
jwt.expiration=36000000
jwt.issuer=BiletalAPI

# Security Configuration
security.admin.endpoint=/api/auth/admin/login

# Admin User Configuration
admin.email=berkayaydmr@hotmail.com
admin.password=berkayaydemir123
admin.firstname=System
admin.lastname=Admin
admin.birthdate=2002-01-01
admin.birthcountry=Turkey
admin.birthcity=Istanbul
admin.gender=MALE
admin.address=Biletal Headquarters
admin.phone=+905555555555

# Application Configuration
application.baseUrl=http://localhost:8081

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:korkutoktayy@gmail.com}
spring.mail.password=${MAIL_PASSWORD:erkaohhezbbktwuz}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.use-management-port=false
springdoc.packages-to-scan=com.biletal.biletalbackend.controller
springdoc.paths-to-match=/api/**

spring.web.resources.static-locations=classpath:/static/

# Logging Configuration
logging.level.com.biletal.biletalbackend.security=DEBUG
logging.level.com.biletal.biletalbackend.exception=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n