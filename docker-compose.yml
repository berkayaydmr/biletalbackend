version: '3.8'
services:
  db:
    image: postgres:15
    container_name: biletal_postgres
    restart: always
    environment:
      POSTGRES_DB: biletaldb
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
